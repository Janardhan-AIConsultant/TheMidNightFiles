[alembic]
script_location = alembic
prepend_sys_path = .
# URL comes from DATABASE_URL (see alembic/env.py); fallback below
sqlalchemy.url = sqlite:///data/substack_automation.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
